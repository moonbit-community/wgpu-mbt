name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # NOTE: ba4deb5d (v27.0.4.0-1) regressed in GitHub-hosted runners (requestAdapter/RequestDevice
  # returns Success with a NULL handle). Pin to the v27.0.4.0 tag commit.
  WGPU_NATIVE_REV: 768f15f6ace8e4ec8e8720d5732b29e0b34250a8
  WGPU_NATIVE_TAG: v27.0.4.0

jobs:
  linux:
    name: Linux Vulkan (full)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (Vulkan + bindgen)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools clang libclang-dev pkg-config

      - name: Configure Vulkan ICD (lavapipe)
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Vulkan ICDs:"
          ls -la /usr/share/vulkan/icd.d || true

          icd=""
          for cand in /usr/share/vulkan/icd.d/lvp_icd.x86_64.json /usr/share/vulkan/icd.d/lvp_icd.json; do
            if [ -f "$cand" ]; then
              icd="$cand"
              break
            fi
          done
          if [ -n "$icd" ]; then
            echo "Using ICD: $icd"
            echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          else
            echo "No lavapipe ICD found; continuing with default loader search."
          fi

          vulkaninfo --summary || true

      - name: Install MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "MOON_HOME=$HOME/.moon" >> "$GITHUB_ENV"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon version
        shell: bash
        run: moon version --all

      - name: Lint (moon check)
        shell: bash
        run: moon check

      - name: Install wgpu-native prebuilt (Vulkan)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/wgpu-native-prebuilt"
          rm -rf "$artifact_root"
          mkdir -p "$artifact_root"

          gh release download -R gfx-rs/wgpu-native "$WGPU_NATIVE_TAG" -p commit-sha -D "$artifact_root"
          actual_rev="$(tr -d '\r\n' < "$artifact_root/commit-sha")"
          if [ "$actual_rev" != "$WGPU_NATIVE_REV" ]; then
            echo "Release $WGPU_NATIVE_TAG commit mismatch: expected $WGPU_NATIVE_REV, got $actual_rev"
            exit 1
          fi

          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) asset="wgpu-linux-x86_64-release.zip" ;;
            aarch64|arm64) asset="wgpu-linux-aarch64-release.zip" ;;
            *)
              echo "Unsupported Linux arch: $arch"
              exit 1
              ;;
          esac
          gh release download -R gfx-rs/wgpu-native "$WGPU_NATIVE_TAG" -p "$asset" -D "$artifact_root"
          unzip -q -o "$artifact_root/$asset" -d "$artifact_root"
          echo "MBT_WGPU_NATIVE_LIB=$artifact_root/lib/libwgpu_native.so" >> "$GITHUB_ENV"

      - name: Probe wgpu smoke (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          moon run --target native src/cmd/main/main.mbt

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          moon test --target native --test-failure-json

      - name: Run strict leak check
        shell: bash
        run: |
          set -euo pipefail
          moon test --target native src/tests/wgpu_report_leak_check_test.mbt --test-failure-json

      - name: Run benchmark suite
        shell: bash
        run: |
          set -euo pipefail
          moon bench --target native -p Milky2018/wgpu_mbt/tests -f wgpu_perf_bench_test.mbt

      - name: Clean build artifacts (before static link verification)
        shell: bash
        run: |
          set -euo pipefail
          moon clean

      - name: Probe wgpu smoke (static link)
        shell: bash
        run: |
          set -euo pipefail
          MBT_WGPU_LINK_MODE=static moon run --target native src/cmd/main/main.mbt

      - name: Run full test suite (static link)
        shell: bash
        run: |
          set -euo pipefail
          MBT_WGPU_LINK_MODE=static moon test --target native --test-failure-json

      - name: Dump wgpu diagnostics (on failure)
        if: failure()
        shell: bash
        env:
          MBT_WGPU_DEBUG_REQUEST_ADAPTER: "1"
          MBT_WGPU_DEBUG_REQUEST_DEVICE: "1"
          MBT_WGPU_LOG_STDERR: "1"
          MBT_WGPU_LOG_LEVEL: "debug"
        run: |
          set +e
          echo "[dynamic]"
          moon run --target native src/cmd/main/main.mbt
          echo "[static]"
          moon clean
          MBT_WGPU_LINK_MODE=static moon run --target native src/cmd/main/main.mbt

      - name: Package contents sanity (exclude artifacts)
        shell: bash
        run: |
          set -euo pipefail
          # `moon package --list` includes status lines like "Running moon check ..." and
          # "Package to .../_build/..."; we only want to validate the file list (one path per line).
          moon package --list | awk '!/ /{print}' > package_files.txt
          if grep -nE '(^|/)(trace\.json|_build|target|src/c/target|vendor)(/|$)' package_files.txt; then
            echo "Unexpected build artifacts included in publish package."
            exit 1
          fi

  macos:
    name: macOS Metal (full)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (bindgen)
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "MOON_HOME=$HOME/.moon" >> "$GITHUB_ENV"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon version
        shell: bash
        run: moon version --all

      - name: Lint (moon check)
        shell: bash
        run: moon check

      - name: Install wgpu-native prebuilt (Metal)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/wgpu-native-prebuilt"
          rm -rf "$artifact_root"
          mkdir -p "$artifact_root"

          gh release download -R gfx-rs/wgpu-native "$WGPU_NATIVE_TAG" -p commit-sha -D "$artifact_root"
          actual_rev="$(tr -d '\r\n' < "$artifact_root/commit-sha")"
          if [ "$actual_rev" != "$WGPU_NATIVE_REV" ]; then
            echo "Release $WGPU_NATIVE_TAG commit mismatch: expected $WGPU_NATIVE_REV, got $actual_rev"
            exit 1
          fi

          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) asset="wgpu-macos-x86_64-release.zip" ;;
            aarch64|arm64) asset="wgpu-macos-aarch64-release.zip" ;;
            *)
              echo "Unsupported macOS arch: $arch"
              exit 1
              ;;
          esac
          gh release download -R gfx-rs/wgpu-native "$WGPU_NATIVE_TAG" -p "$asset" -D "$artifact_root"
          unzip -q -o "$artifact_root/$asset" -d "$artifact_root"
          echo "MBT_WGPU_NATIVE_LIB=$artifact_root/lib/libwgpu_native.dylib" >> "$GITHUB_ENV"

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          moon test --target native --test-failure-json

      - name: Run strict leak check
        shell: bash
        run: |
          set -euo pipefail
          moon test --target native src/tests/wgpu_report_leak_check_test.mbt --test-failure-json

      - name: Run benchmark suite
        shell: bash
        run: |
          set -euo pipefail
          moon bench --target native -p Milky2018/wgpu_mbt/tests -f wgpu_perf_bench_test.mbt

      - name: Clean build artifacts (before static link verification)
        shell: bash
        run: |
          set -euo pipefail
          moon clean

      - name: Probe wgpu smoke (static link)
        shell: bash
        run: |
          set -euo pipefail
          MBT_WGPU_LINK_MODE=static moon run --target native src/cmd/main/main.mbt

      - name: Run full test suite (static link)
        shell: bash
        run: |
          set -euo pipefail
          MBT_WGPU_LINK_MODE=static moon test --target native --test-failure-json

      - name: Dump wgpu diagnostics (on failure)
        if: failure()
        shell: bash
        env:
          MBT_WGPU_DEBUG_REQUEST_ADAPTER: "1"
          MBT_WGPU_DEBUG_REQUEST_DEVICE: "1"
          MBT_WGPU_LOG_STDERR: "1"
          MBT_WGPU_LOG_LEVEL: "debug"
        run: |
          set +e
          echo "[dynamic]"
          moon run --target native src/cmd/main/main.mbt
          echo "[static]"
          moon clean
          MBT_WGPU_LINK_MODE=static moon run --target native src/cmd/main/main.mbt

  windows:
    name: Windows (Lavapipe Vulkan, full)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (bindgen)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install -y llvm
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      
      - name: Install Vulkan Runtime + Lavapipe (software Vulkan)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime_only: true
          install_lavapipe: true
          cache: true
          stripdown: true
          github_token: ${{ github.token }}

      - name: Install MoonBit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipUrl = "https://cli.moonbitlang.com/binaries/latest/moonbit-windows-x86_64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "moonbit.zip"
          $coreUrl = "https://cli.moonbitlang.com/cores/core-latest.zip"
          $coreZipPath = Join-Path $env:RUNNER_TEMP "core.zip"
          $moonHome = Join-Path $env:USERPROFILE ".moon"
          $moonLib = Join-Path $moonHome "lib"

          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          New-Item -ItemType Directory -Force -Path $moonHome | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $moonHome -Force

          # The Windows zip does not include the standard library checkout.
          # Install core explicitly (mirrors unix.sh install logic).
          Invoke-WebRequest -Uri $coreUrl -OutFile $coreZipPath
          New-Item -ItemType Directory -Force -Path $moonLib | Out-Null
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $moonLib "core")
          Expand-Archive -Path $coreZipPath -DestinationPath $moonLib -Force

          "MOON_HOME=$moonHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $moonHome "bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          # Bundle core so `moon check` can inject `moonbitlang/core`.
          $env:MOON_HOME = $moonHome
          $env:PATH = (Join-Path $moonHome "bin") + ";" + $env:PATH
          $coreManifest = Join-Path $moonLib "core\\moon.mod.json"
          moon bundle --warn-list -a --all --manifest-path $coreManifest
          moon bundle --warn-list -a --target wasm-gc --manifest-path $coreManifest --quiet

      - name: Moon version
        shell: pwsh
        run: moon version --all

      - name: Lint (moon check)
        shell: pwsh
        run: moon check

      - name: Configure Vulkan ICD (lavapipe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Prefer the ICD path installed by install-vulkan-sdk-action (RUNNER_TOOL_CACHE),
          # but fallback to C:\Lavapipe for older layouts.
          $toolCache = $env:RUNNER_TOOL_CACHE
          if ([string]::IsNullOrEmpty($toolCache)) {
            $toolCache = "C:\\hostedtoolcache\\windows"
          }
          $vkIcd = $null
          $toolCacheIcd = Get-ChildItem -Path (Join-Path $toolCache "lavapipe") -Recurse -Filter "lvp_icd.x86_64.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($toolCacheIcd) {
            $vkIcd = $toolCacheIcd.FullName
          } elseif (Test-Path "C:\\Lavapipe\\share\\vulkan\\icd.d\\lvp_icd.x86_64.json") {
            $vkIcd = "C:\\Lavapipe\\share\\vulkan\\icd.d\\lvp_icd.x86_64.json"
          } else {
            Write-Host "Lavapipe ICD not found in toolcache or C:\\Lavapipe"
            Get-ChildItem -Path $toolCache -Recurse -ErrorAction SilentlyContinue | Select-Object -First 200 | Out-Host
            Get-ChildItem -Path "C:\\Lavapipe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 200 | Out-Host
            throw "Lavapipe ICD missing"
          }

          # Ensure the Vulkan loader (vulkan-1.dll) is discoverable.
          $sdkRoot = $env:VULKAN_SDK
          $sdkVer = $env:VULKAN_VERSION
          if ([string]::IsNullOrEmpty($sdkRoot) -or [string]::IsNullOrEmpty($sdkVer)) {
            throw "VULKAN_SDK/VULKAN_VERSION not set by install-vulkan-sdk-action"
          }
          $runtimeDir = Join-Path (Join-Path $sdkRoot $sdkVer) "runtime\\x64"
          $vkDll = Join-Path $runtimeDir "vulkan-1.dll"
          if (!(Test-Path $vkDll)) {
            Write-Host "Vulkan loader not found at: $vkDll"
            Get-ChildItem -Path $runtimeDir -ErrorAction SilentlyContinue | Out-Host
            throw "vulkan-1.dll missing"
          }
          # Also add Lavapipe's bin dir so its dependent DLLs resolve.
          $lavapipeBin = $null
          if ($vkIcd -like "*\\x64\\share\\vulkan\\icd.d\\lvp_icd.x86_64.json") {
            $x64Dir = Split-Path (Split-Path (Split-Path (Split-Path $vkIcd -Parent) -Parent) -Parent) -Parent
            $lavapipeBin = Join-Path $x64Dir "bin"
          } else {
            $lavapipeBin = "C:\\Lavapipe\\bin"
          }
          if (!(Test-Path $lavapipeBin)) {
            Write-Host "Lavapipe bin dir not found at: $lavapipeBin"
            Get-ChildItem -Path (Split-Path $vkIcd -Parent) -Recurse -ErrorAction SilentlyContinue | Select-Object -First 200 | Out-Host
            throw "Lavapipe bin missing"
          }
          $runtimeDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $lavapipeBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          "VK_ICD_FILENAMES=$vkIcd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install wgpu-native prebuilt (Vulkan)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "wgpu-native-prebuilt"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $artifactRoot
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          gh release download -R gfx-rs/wgpu-native $env:WGPU_NATIVE_TAG -p commit-sha -D $artifactRoot
          $actualRev = (Get-Content (Join-Path $artifactRoot "commit-sha") -Raw).Trim()
          if ($actualRev -ne $env:WGPU_NATIVE_REV) {
            throw "Release $($env:WGPU_NATIVE_TAG) commit mismatch: expected $($env:WGPU_NATIVE_REV), got $actualRev"
          }

          $arch = $env:PROCESSOR_ARCHITECTURE
          if ([string]::IsNullOrEmpty($arch)) {
            throw "PROCESSOR_ARCHITECTURE is empty"
          }
          switch ($arch.ToUpperInvariant()) {
            "AMD64" { $asset = "wgpu-windows-x86_64-msvc-release.zip" }
            "ARM64" { $asset = "wgpu-windows-aarch64-msvc-release.zip" }
            default { throw "Unsupported Windows arch: $arch" }
          }
          gh release download -R gfx-rs/wgpu-native $env:WGPU_NATIVE_TAG -p $asset -D $artifactRoot
          Expand-Archive -Path (Join-Path $artifactRoot $asset) -DestinationPath $artifactRoot -Force
          $dllPath = Join-Path $artifactRoot "lib\\wgpu_native.dll"
          if (!(Test-Path $dllPath)) {
            throw "Missing wgpu_native.dll at $dllPath"
          }
          "MBT_WGPU_NATIVE_LIB=$dllPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Probe wgpu smoke (diagnostic)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          moon run --target native src/cmd/main/main.mbt

      - name: Run full test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          moon test --target native --test-failure-json

      - name: Run strict leak check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          moon test --target native src/tests/wgpu_report_leak_check_test.mbt --test-failure-json

      - name: Run benchmark suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          moon bench --target native -p Milky2018/wgpu_mbt/tests -f wgpu_perf_bench_test.mbt

      - name: Clean build artifacts (before static link verification)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          moon clean

      - name: Probe wgpu smoke (static link)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:MBT_WGPU_LINK_MODE = "static"
          moon run --target native src/cmd/main/main.mbt

      - name: Run full test suite (static link)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:MBT_WGPU_LINK_MODE = "static"
          moon test --target native --test-failure-json

      - name: Dump wgpu diagnostics (on failure)
        if: failure()
        shell: pwsh
        env:
          MBT_WGPU_DEBUG_REQUEST_ADAPTER: "1"
          MBT_WGPU_DEBUG_REQUEST_DEVICE: "1"
          MBT_WGPU_LOG_STDERR: "1"
          MBT_WGPU_LOG_LEVEL: "debug"
          VK_LOADER_DEBUG: all
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "[dynamic]"
          moon run --target native src/cmd/main/main.mbt
          Write-Host "[static]"
          moon clean
          $env:MBT_WGPU_LINK_MODE = "static"
          moon run --target native src/cmd/main/main.mbt
